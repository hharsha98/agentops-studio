services:
  web:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev:web"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    volumes:
      - .:/workspace
    depends_on:
      - api

  api:
    image: python:3.12-slim
    working_dir: /workspace/apps/api
    command: sh -c "pip install -e '.[dev]' && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://agentops:agentops@postgres:5432/agentops
      MODEL_BASE_URL: http://host.docker.internal:3001/v1
      MODEL_NAME: auto
      PUBLIC_DEMO_MODE: "true"
    volumes:
      - .:/workspace
    depends_on:
      - postgres
      - redis

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: agentops
      POSTGRES_PASSWORD: agentops
      POSTGRES_DB: agentops
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"

  firecrawl-placeholder:
    image: alpine:3.20
    command: sh -c "echo Firecrawl service placeholder; sleep infinity"

  langfuse-placeholder:
    image: alpine:3.20
    command: sh -c "echo Langfuse service placeholder; sleep infinity"

volumes:
  postgres-data:
