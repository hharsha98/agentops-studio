services:
  web:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev:web -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    volumes:
      - .:/workspace
    depends_on:
      api:
        condition: service_healthy

  api:
    image: python:3.12-slim
    working_dir: /workspace/apps/api
    command: sh -c "pip install -e '.[dev]' && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      MODEL_BASE_URL: http://host.docker.internal:3001/v1
      MODEL_NAME: auto
      PUBLIC_DEMO_MODE: "true"
      FORCE_DETERMINISTIC: "true"
      DATABASE_URL: postgresql://agentops:agentops@postgres:5432/agentops
      REDIS_URL: redis://redis:6379/0
      SEARXNG_URL: http://searxng:8080
      DEMO_DATA_DIR: /workspace/demo-data
    volumes:
      - .:/workspace
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: agentops
      POSTGRES_PASSWORD: agentops
      POSTGRES_DB: agentops
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentops -d agentops"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    profiles: ["research"]

volumes:
  postgres-data:
