services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    image: agentops-web:local
    ports:
      - "3010:3010"
    environment:
      API_BASE_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      PORT: "3010"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3010/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  web-dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev -w apps/web -- --port 3010"
    ports:
      - "3010:3010"
    environment:
      API_BASE_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    volumes:
      - .:/workspace
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: agentops-api:local
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://agentops:agentops@postgres:5432/agentops
      REDIS_URL: redis://redis:6379/0
      WORKER_QUEUE_NAME: agentops
      MODEL_BASE_URL: http://host.docker.internal:3001/v1
      MODEL_NAME: auto
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      ENABLE_LIVE_LLM: ${ENABLE_LIVE_LLM:-true}
      PUBLIC_DEMO_MODE: "true"
      REQUIRE_REDIS_FOR_READY: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2).read()\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: agentops-api:local
    command: rq worker --url redis://redis:6379/0 agentops
    environment:
      DATABASE_URL: postgresql+psycopg://agentops:agentops@postgres:5432/agentops
      REDIS_URL: redis://redis:6379/0
      WORKER_QUEUE_NAME: agentops
      MODEL_BASE_URL: http://host.docker.internal:3001/v1
      MODEL_NAME: auto
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      ENABLE_LIVE_LLM: ${ENABLE_LIVE_LLM:-true}
      PUBLIC_DEMO_MODE: "true"
      REQUIRE_REDIS_FOR_READY: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis; redis.Redis.from_url('redis://redis:6379/0').ping()\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: agentops
      POSTGRES_PASSWORD: agentops
      POSTGRES_DB: agentops
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentops -d agentops"]
      interval: 10s
      timeout: 5s
      retries: 6

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"

  firecrawl-placeholder:
    image: alpine:3.20
    command: sh -c "echo Firecrawl service placeholder; sleep infinity"

  langfuse-placeholder:
    image: alpine:3.20
    command: sh -c "echo Langfuse service placeholder; sleep infinity"

volumes:
  postgres-data:
