apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentops-web
  namespace: agentops-studio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentops-web
  template:
    metadata:
      labels:
        app: agentops-web
    spec:
      containers:
        - name: web
          image: agentops-web:local
          ports:
            - containerPort: 3010
          env:
            - name: PORT
              value: "3010"
            - name: API_BASE_URL
              value: http://agentops-api:8000
            - name: NEXT_PUBLIC_API_BASE_URL
              value: http://agentops-api:8000
