apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentops-web
  namespace: agentops-studio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentops-web
  template:
    metadata:
      labels:
        app: agentops-web
    spec:
      containers:
        - name: web
          image: agentops-web:local
          ports:
            - containerPort: 3000
          env:
            # The image is built with NEXT_PUBLIC_API_URL=/api. This is the runtime hop.
            - name: API_PROXY_TARGET
              value: http://agentops-api:8000

