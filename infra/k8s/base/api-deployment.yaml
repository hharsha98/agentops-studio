apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentops-api
  namespace: agentops-studio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentops-api
  template:
    metadata:
      labels:
        app: agentops-api
    spec:
      containers:
        - name: api
          image: agentops-api:local
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agentops-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: agentops-secrets
                  key: redis-url
            - name: WORKER_QUEUE_NAME
              value: agentops
            - name: REQUIRE_REDIS_FOR_READY
              value: "true"
            - name: MODEL_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: agentops-secrets
                  key: model-base-url
            - name: MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentops-secrets
                  key: model-api-key
