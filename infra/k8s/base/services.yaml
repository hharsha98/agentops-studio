apiVersion: v1
kind: Service
metadata:
  name: agentops-web
  namespace: agentops-studio
spec:
  selector:
    app: agentops-web
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: agentops-api
  namespace: agentops-studio
spec:
  selector:
    app: agentops-api
  ports:
    - port: 8000
      targetPort: 8000

